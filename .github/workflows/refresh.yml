# Jalankan refresh.py terjadwal, enkripsi hasilnya, commit data/dashboard.json.enc.
# Repo ini PUBLIK → JSON mentah hanya ada di $RUNNER_TEMP dan tidak pernah di-commit.
#
# Secrets (Settings → Secrets and variables → Actions):
#   SALES_SYNC_URL, SALES_SYNC_KEY      wajib
#   DASHBOARD_PASSWORD                  wajib, min. 16 karakter acak
#   META_ACCESS_TOKEN, META_AD_ACCOUNT_ID   opsional (tanpa ini closing%/ROAS kosong)
# Variables (opsional): META_CONTACT_ACTION, META_API_VERSION
#
# Jadwal hanya jalan di default branch. Jalankan manual: Actions → Refresh dashboard data → Run workflow.
name: Refresh dashboard data

on:
  schedule:
    - cron: '17 */3 * * *'   # tiap 3 jam (UTC), menit 17 supaya tidak antre di :00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tes
        run: python -m unittest discover tests

      - name: Ambil data & enkripsi
        env:
          SALES_SYNC_URL: ${{ secrets.SALES_SYNC_URL }}
          SALES_SYNC_KEY: ${{ secrets.SALES_SYNC_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_CONTACT_ACTION: ${{ vars.META_CONTACT_ACTION }}
          META_API_VERSION: ${{ vars.META_API_VERSION }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          if [ "${#DASHBOARD_PASSWORD}" -lt 16 ]; then
            echo "::error::Secret DASHBOARD_PASSWORD belum diisi (min. 16 karakter)"; exit 1
          fi
          python refresh.py --out "$RUNNER_TEMP/dashboard.json"
          python encrypt_data.py "$RUNNER_TEMP/dashboard.json" data/dashboard.json.enc
          rm -f "$RUNNER_TEMP/dashboard.json"

      - name: Commit kalau ada perubahan
        run: |
          git add data/dashboard.json.enc
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data"; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "data: refresh dashboard $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M') WIB"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
